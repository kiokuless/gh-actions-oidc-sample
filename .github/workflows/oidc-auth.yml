name: OIDC Authentication Example

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# Required permissions for OIDC token
permissions:
  id-token: write
  contents: read

env:
  # Configure your OIDC server URL here
  OIDC_SERVER_URL: ${{ vars.OIDC_SERVER_URL || 'http://localhost:8080' }}

jobs:
  authenticate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Get OIDC Token
        id: get-token
        run: |
          # Request OIDC token from GitHub
          OIDC_TOKEN=$(curl -sLS -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=${{ env.OIDC_SERVER_URL }}" | jq -r '.value')

          if [ -z "$OIDC_TOKEN" ] || [ "$OIDC_TOKEN" = "null" ]; then
            echo "::error::Failed to get OIDC token"
            exit 1
          fi

          echo "token=$OIDC_TOKEN" >> $GITHUB_OUTPUT
          echo "OIDC token retrieved successfully"

      - name: Authenticate with OIDC Server
        id: auth
        run: |
          # Send token to OIDC server for authentication
          RESPONSE=$(curl -sS -X POST "${{ env.OIDC_SERVER_URL }}/auth" \
            -H "Content-Type: application/json" \
            -d "{\"token\": \"${{ steps.get-token.outputs.token }}\"}" \
            --fail-with-body || true)

          echo "Response: $RESPONSE"

          SUCCESS=$(echo "$RESPONSE" | jq -r '.success')
          if [ "$SUCCESS" = "true" ]; then
            ACCESS_TOKEN=$(echo "$RESPONSE" | jq -r '.access_token')
            echo "access_token=$ACCESS_TOKEN" >> $GITHUB_OUTPUT
            echo "::notice::Authentication successful!"
          else
            MESSAGE=$(echo "$RESPONSE" | jq -r '.message')
            echo "::warning::Authentication failed: $MESSAGE"
          fi

      - name: Use Access Token
        if: steps.auth.outputs.access_token
        run: |
          echo "Access token obtained: ${{ steps.auth.outputs.access_token }}"
          echo "You can now use this token to access protected resources"
